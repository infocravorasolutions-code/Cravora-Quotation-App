# Place under /etc/nginx/sites-available/ and symlink into sites-enabled.
# Adjust root path to where you deploy the built frontend (dist/).

server {
    listen 80;
    server_name quote.cravorasolutions.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name quote.cravorasolutions.com;

    # SSL managed by certbot / Hostinger — keep your existing cert paths if already set.
    # ssl_certificate     /etc/letsencrypt/live/quote.cravorasolutions.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/quote.cravorasolutions.com/privkey.pem;

    root /var/www/cravora-quote/dist;
    index index.html;

    client_max_body_size 25m;

    location /api/ {
        proxy_pass http://127.0.0.1:5001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
