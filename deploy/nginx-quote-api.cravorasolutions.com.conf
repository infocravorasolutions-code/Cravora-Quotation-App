# Nginx configuration for backend API on Hostinger VPS
# Place under /etc/nginx/sites-available/quote-api.cravorasolutions.com.conf
# Symlink: sudo ln -sf /etc/nginx/sites-available/quote-api.cravorasolutions.com.conf /etc/nginx/sites-enabled/
# Then run: sudo certbot --nginx -d quote-api.cravorasolutions.com

server {
    listen 80;
    server_name quote-api.cravorasolutions.com;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
